[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-sanctions"
version = "0.1.0"
description = "Local synthetic KYC screening tools and MCP server"
requires-python = ">=3.11"
dependencies = ["kyc-core", "mcp>=1.9,<2", "rapidfuzz>=3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kyc_sanctions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
