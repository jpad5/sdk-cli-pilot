name: Eval gate

on:
  pull_request:
    paths:
      - "src/foundry-kyc-agent/**"
      - "shared/**"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_THRESHOLD: "0.8"
  PYTHONUTF8: "1"

jobs:
  evals:
    name: KYC agent evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC for live evals
      pull-requests: write   # PR summary comment
    env:
      KYC_DATA_DIR: ${{ github.workspace }}/.data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/**/pyproject.toml
            src/**/pyproject.toml

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          EXTRAS="dev"
          if [ "${{ vars.LIVE_EVALS }}" = "true" ]; then EXTRAS="dev,live"; fi
          pip install -e shared/kyc_core -e shared/mcp-sanctions -e "src/foundry-kyc-agent[$EXTRAS]"

      - name: Mock evals
        id: mock
        continue-on-error: true
        env:
          DEMO_MODE: mock
          KYC_DATA_DIR: ${{ github.workspace }}/.data/mock
        run: |
          set -o pipefail
          python -m kyc_agent.evals --mode mock --threshold "$EVAL_THRESHOLD" | tee "$RUNNER_TEMP/mock-evals.txt"

      - name: Azure login (OIDC)
        if: ${{ vars.LIVE_EVALS == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Live evals
        id: live
        if: ${{ vars.LIVE_EVALS == 'true' }}
        continue-on-error: true
        env:
          DEMO_MODE: live
          KYC_DATA_DIR: ${{ github.workspace }}/.data/live
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT: ${{ vars.FOUNDRY_MODEL_DEPLOYMENT }}
        run: |
          set -o pipefail
          python -m kyc_agent.evals --mode live --threshold "$EVAL_THRESHOLD" | tee "$RUNNER_TEMP/live-evals.txt"

      - name: Upload eval-results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: .data/**/eval-results.json
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".data"
          threshold = float(os.environ["EVAL_THRESHOLD"])
          lines = ["## KYC agent eval gate", "",
                   f"Threshold: **{threshold:.0%}**", "",
                   "| Mode | Passed | Pass rate | Mean score | Gate |",
                   "|---|---|---|---|---|"]
          failures = []
          for mode in ("mock", "live"):
              path = root / mode / "eval-results.json"
              if not path.exists():
                  if mode == "mock":
                      lines.append("| mock | - | - | - | :x: no results |")
                  continue
              r = json.loads(path.read_text(encoding="utf-8"))
              rate = r.get("pass_rate", 0.0)
              ok = rate >= threshold
              lines.append(f"| {mode} | {r.get('passed')}/{r.get('total')} | {rate:.0%} | "
                           f"{r.get('mean_score', 0):.2f} | {':white_check_mark:' if ok else ':x:'} |")
              failures += [f"- `{mode}` **{c['case_id']}**: {c.get('detail', '')}"
                           for c in r.get("cases", []) if not c.get("passed")]
          if failures:
              lines += ["", "<details><summary>Failing cases</summary>", "", *failures, "", "</details>"]
          lines += ["", f"_Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}_"]
          body = "\n".join(lines)
          pathlib.Path(os.environ["RUNNER_TEMP"], "eval-summary.md").write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(body + "\n")
          PY

      - name: Comment on PR
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --body-file "$RUNNER_TEMP/eval-summary.md" \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/eval-summary.md"

      - name: Enforce threshold
        if: always()
        run: |
          if [ "${{ steps.mock.outcome }}" != "success" ]; then
            echo "::error::Mock evals below threshold ($EVAL_THRESHOLD) or failed."; exit 1
          fi
          if [ "${{ vars.LIVE_EVALS }}" = "true" ] && [ "${{ steps.live.outcome }}" != "success" ]; then
            echo "::error::Live evals below threshold ($EVAL_THRESHOLD) or failed."; exit 1
          fi
          echo "Eval gate passed."
