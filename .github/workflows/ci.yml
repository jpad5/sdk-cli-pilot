name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_MODE: mock
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python tests (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/**/pyproject.toml
            src/**/pyproject.toml

      - name: Install packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e "shared/kyc_core[dev]" \
                      -e shared/mcp-sanctions \
                      -e "src/foundry-kyc-agent[dev]" \
                      -e "src/m365-host[test]"

      - name: Test shared/mcp-sanctions
        working-directory: shared/mcp-sanctions
        env:
          KYC_DATA_DIR: ${{ runner.temp }}/data-sanctions
        run: python -m pytest -q -p no:cacheprovider

      - name: Test src/foundry-kyc-agent
        working-directory: src/foundry-kyc-agent
        env:
          KYC_DATA_DIR: ${{ runner.temp }}/data-agent
        run: python -m pytest -q -p no:cacheprovider

      - name: Test src/m365-host
        working-directory: src/m365-host
        env:
          KYC_DATA_DIR: ${{ runner.temp }}/data-m365
        run: python -m pytest -q -p no:cacheprovider

  node:
    name: agent-ops-copilot (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agent-ops-copilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/agent-ops-copilot/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  bicep:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build infra/main.bicep
        if: ${{ hashFiles('infra/main.bicep') != '' }}
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Skip (no infra/main.bicep)
        if: ${{ hashFiles('infra/main.bicep') == '' }}
        run: echo "infra/main.bicep not present - skipping bicep build."
