[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-agent"
version = "0.1.0"
description = "KYC/AML compliance agent: deterministic mock + Microsoft Foundry Agent Service implementation"
requires-python = ">=3.11"
dependencies = ["kyc-core", "kyc-sanctions"]

[project.optional-dependencies]
live = [
  "azure-ai-projects>=2.0.0",
  "azure-identity>=1.19",
  "openai>=1.90",
  "azure-ai-evaluation>=1.10",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["kyc_agent", "kyc_agent.evals"]

[tool.setuptools.package-data]
"kyc_agent.evals" = ["*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
